{% extends 'base.html' %}
{% block content %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css' rel='stylesheet' />
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">Calendar</h2>
        <p class="text-muted mb-0">Overview of medicines and reminders for the month.</p>
    </div>
</div>

<div id='calendar'></div>

<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js'></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var events = {{ events|tojson }};
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: events,
            eventDidMount: function(info) {
                if (info.event.extendedProps && info.event.extendedProps.status) {
                    // style based on status
                    if (info.event.extendedProps.status === 'taken') {
                        info.el.style.borderColor = '#16a34a';
                    } else if (info.event.extendedProps.status === 'skipped') {
                        info.el.style.opacity = 0.6;
                    }
                }
            }
        });
        calendar.render();
    });
</script>
{% endblock %}
